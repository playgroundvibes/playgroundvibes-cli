name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Checks (${{ matrix.package_manager }}, ${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        package_manager: [npm, pnpm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        if: matrix.package_manager == 'pnpm'
        with:
          # Read the exact pnpm version from package.json's packageManager field.
          run_install: false
          cache: false
      - name: Verify the checkout has no build output
        run: >-
          node --input-type=module -e "import { existsSync } from 'node:fs'; if (existsSync('dist')) throw new Error('Expected a clean checkout without dist');"
      - name: Install package-lock.json dependencies
        if: matrix.package_manager == 'npm'
        run: npm ci --ignore-scripts
      - name: Install pnpm-lock.yaml dependencies
        if: matrix.package_manager == 'pnpm'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check formatting, compile, test, and verify package
        run: ${{ matrix.package_manager }} run check
      - name: Inspect npm tarball contents
        if: matrix.package_manager == 'npm'
        # The complete prepack checks ran above; avoid running them twice.
        run: npm pack --dry-run --ignore-scripts
      - name: Inspect pnpm tarball contents
        if: matrix.package_manager == 'pnpm'
        # pnpm accepts ignore-scripts through its configuration flags.
        run: pnpm --config.ignore-scripts=true pack --dry-run
